<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:24px; background: var(--paper); display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  .pill { font-family: var(--font-body); font-size:13px; font-weight:600; padding:7px 14px; border-radius: var(--r-pill); display:inline-flex; align-items:center; gap:6px; }
  .pill-blue { background: rgba(31,122,236,0.10); color: var(--brand-blue); }
  .pill-orange { background: rgba(245,138,31,0.12); color: var(--brand-orange-deep); }
  .pill-success { background: rgba(31,174,107,0.12); color: var(--success); }
  .pill-outline { background: var(--paper); color: var(--fg-1); border:1px solid var(--line-1); }
  .pill-dark { background: var(--brand-navy); color:#fff; }
</style></head>
<body>
  <span class="pill pill-blue">● Live campaign</span>
  <span class="pill pill-orange">New</span>
  <span class="pill pill-success">✓ Verified result</span>
  <span class="pill pill-outline">HVAC</span>
  <span class="pill pill-outline">Solar</span>
  <span class="pill pill-outline">EV Repair</span>
  <span class="pill pill-dark">US · UK · CA · AU</span>
</body></html>
