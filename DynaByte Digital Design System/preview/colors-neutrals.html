<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:24px; background: var(--paper); }
  .row { display:grid; grid-template-columns: repeat(6, 1fr); gap:8px; }
  .sw { border-radius: var(--r-sm); height:70px; padding:6px 8px; display:flex; flex-direction:column; justify-content:flex-end; font-family: var(--font-body); font-size:11px; font-weight:600; border: 1px solid var(--line-1); }
  .sw small { display:block; font-weight:500; opacity:.7; font-size:10px; }
</style></head>
<body>
  <div class="row">
    <div class="sw" style="background:var(--ink-900); color:#fff">Ink 900<small>#0B1B3A</small></div>
    <div class="sw" style="background:var(--ink-800); color:#fff">800<small>#1B2A4E</small></div>
    <div class="sw" style="background:var(--ink-700); color:#fff">700<small>#2C3A5C</small></div>
    <div class="sw" style="background:var(--ink-600); color:#fff">600<small>#4A5878</small></div>
    <div class="sw" style="background:var(--ink-500); color:#fff">500<small>#6E7A98</small></div>
    <div class="sw" style="background:var(--ink-400); color:#fff">400<small>#95A0BA</small></div>
    <div class="sw" style="background:var(--ink-300); color:var(--ink-900)">300<small>#C2C9DB</small></div>
    <div class="sw" style="background:var(--ink-200); color:var(--ink-900)">200<small>#E1E5EE</small></div>
    <div class="sw" style="background:var(--ink-100); color:var(--ink-900)">100<small>#EEF1F7</small></div>
    <div class="sw" style="background:var(--ink-050); color:var(--ink-900)">050<small>#F6F8FC</small></div>
    <div class="sw" style="background:var(--paper); color:var(--ink-900)">Paper<small>#FFFFFF</small></div>
    <div class="sw" style="background: var(--success); color:#fff">Success<small>#1FAE6B</small></div>
  </div>
</body></html>
