<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:24px; background: var(--paper); }
  .row { display:grid; grid-template-columns: repeat(7, 1fr); gap:8px; align-items:end; }
  .box { background: var(--brand-blue); border-radius: var(--r-sm); display:flex; align-items:flex-end; justify-content:center; color:#fff; font-size:10px; font-weight:600; padding-bottom:4px; font-family: var(--font-body); }
  .lbl { font-size: 10px; color: var(--fg-3); text-align:center; margin-top:4px; font-family: var(--font-body); }
</style></head>
<body>
  <div class="row">
    <div><div class="box" style="height:8px"></div><div class="lbl">4 / sp1</div></div>
    <div><div class="box" style="height:16px"></div><div class="lbl">8 / sp2</div></div>
    <div><div class="box" style="height:24px"></div><div class="lbl">12 / sp3</div></div>
    <div><div class="box" style="height:32px"></div><div class="lbl">16 / sp4</div></div>
    <div><div class="box" style="height:48px"></div><div class="lbl">24 / sp5</div></div>
    <div><div class="box" style="height:64px"></div><div class="lbl">32 / sp6</div></div>
    <div><div class="box" style="height:96px"></div><div class="lbl">48 / sp7</div></div>
  </div>
</body></html>
