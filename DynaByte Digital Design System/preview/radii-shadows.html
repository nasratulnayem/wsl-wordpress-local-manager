<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:24px; background: var(--paper); display:grid; grid-template-columns: repeat(5, 1fr); gap:12px; }
  .swatch { background: var(--paper); border:1px solid var(--line-1); aspect-ratio: 1.4 / 1; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:4px; font-family: var(--font-body); font-size:11px; color: var(--fg-3); }
  .swatch b { font-size: 13px; color: var(--fg-1); font-weight: 700; }
</style></head>
<body>
  <div class="swatch" style="border-radius: var(--r-xs)"><b>4px</b>r-xs</div>
  <div class="swatch" style="border-radius: var(--r-sm)"><b>8px</b>r-sm</div>
  <div class="swatch" style="border-radius: var(--r-md)"><b>12px</b>r-md</div>
  <div class="swatch" style="border-radius: var(--r-lg)"><b>16px</b>r-lg</div>
  <div class="swatch" style="border-radius: var(--r-xl)"><b>24px</b>r-xl ★</div>
  <div class="swatch" style="border-radius: var(--r-2xl)"><b>32px</b>r-2xl</div>
  <div class="swatch" style="border-radius: var(--r-pill)"><b>pill</b>buttons</div>
  <div class="swatch" style="box-shadow: var(--sh-1); border-color: transparent"><b>sh-1</b>sticky</div>
  <div class="swatch" style="box-shadow: var(--sh-2); border-color: transparent"><b>sh-2</b>card</div>
  <div class="swatch" style="box-shadow: var(--sh-3); border-color: transparent"><b>sh-3</b>hover</div>
</body></html>
