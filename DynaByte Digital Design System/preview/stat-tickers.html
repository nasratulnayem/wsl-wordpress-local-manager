<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:24px; background: var(--brand-navy); display:grid; grid-template-columns: repeat(3, 1fr); gap:14px; }
  .stat { background: rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.10); border-radius: var(--r-xl); padding: 18px 22px; }
  .num { font-family: var(--font-display); font-size: 38px; font-weight: 800; line-height: 1; color: #fff; letter-spacing: -0.02em; }
  .num em { font-style: normal; color: var(--brand-orange); }
  .lbl { display:block; margin-top: 8px; font-size: 13px; color: rgba(255,255,255,0.7); font-weight: 500; }
</style></head>
<body>
  <div class="stat"><div class="num">558<em>%</em></div><span class="lbl">increase in click-throughs</span></div>
  <div class="stat"><div class="num">£412<em>K</em></div><span class="lbl">revenue attributed</span></div>
  <div class="stat"><div class="num">4.2<em>×</em></div><span class="lbl">purchase ROAS</span></div>
</body></html>
