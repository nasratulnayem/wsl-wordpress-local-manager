<!doctype html><html><head><meta charset="utf-8"><title>Logo</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:24px; background: var(--bg-soft); display:flex; gap:24px; align-items:center; justify-content:center; }
  .tile { background: var(--paper); border:1px solid var(--line-1); border-radius: var(--r-lg); padding:20px 24px; display:flex; align-items:center; justify-content:center; height:120px; flex:1; }
  .tile.dark { background: var(--brand-navy); border-color: var(--line-on-dark); }
  img { max-height: 80px; max-width: 100%; }
</style></head>
<body>
  <div class="tile"><img src="../assets/dynabyte-logo.png" alt="DynaByte logo"></div>
  <div class="tile dark"><img src="../assets/dynabyte-logo.png" alt="DynaByte logo"></div>
</body></html>
