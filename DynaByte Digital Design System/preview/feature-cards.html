<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:24px; background: var(--bg-soft); display:grid; grid-template-columns: 1fr 1fr; gap:16px; }
  .card { background: var(--paper); border: 1px solid var(--line-1); border-radius: var(--r-xl); padding: 22px; box-shadow: var(--sh-2); }
  .icon { width: 44px; height: 44px; border-radius: var(--r-md); background: rgba(31,122,236,0.1); color: var(--brand-blue); display:flex; align-items:center; justify-content:center; margin-bottom: 14px; }
  .card h4 { font-family: var(--font-display); font-size: 17px; margin: 0 0 6px; color: var(--fg-1); }
  .card p { font-size: 13.5px; line-height: 1.55; color: var(--fg-2); margin:0; }
</style></head>
<body>
  <div class="card">
    <div class="icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/></svg></div>
    <h4>Audience Strategy</h4>
    <p>Built on location, interests, life events, and lookalikes from your customer data.</p>
  </div>
  <div class="card">
    <div class="icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M3 17l6-6 4 4 8-8"/><path d="M14 7h7v7"/></svg></div>
    <h4>Creative That Works</h4>
    <p>Copy and creative direction that stops the scroll instead of blending in.</p>
  </div>
</body></html>
