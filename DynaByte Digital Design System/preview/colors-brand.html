<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:24px; background: var(--paper); }
  .row { display:grid; grid-template-columns: repeat(5, 1fr); gap:12px; }
  .sw { border-radius: var(--r-md); height:90px; padding:10px 12px; display:flex; flex-direction:column; justify-content:flex-end; color:#fff; font-family: var(--font-body); font-size:12px; font-weight:600; box-shadow: var(--sh-1); }
  .sw small { display:block; font-weight:500; opacity:.85; font-size:11px; margin-top:2px; }
</style></head>
<body>
  <div class="row">
    <div class="sw" style="background:var(--brand-navy)">Navy<small>#0B1B3A</small></div>
    <div class="sw" style="background:var(--brand-navy-2)">Navy 2<small>#11244C</small></div>
    <div class="sw" style="background:var(--brand-blue-deep)">Blue Deep<small>#1457C2</small></div>
    <div class="sw" style="background:var(--brand-blue)">Blue<small>#1F7AEC</small></div>
    <div class="sw" style="background:var(--brand-blue-bright)">Blue Bright<small>#2E9CFF</small></div>
    <div class="sw" style="background:var(--brand-cyan); color: var(--brand-navy)">Cyan<small>#6FC3FF</small></div>
    <div class="sw" style="background:var(--brand-orange-deep)">Orange Deep<small>#E26A00</small></div>
    <div class="sw" style="background:var(--brand-orange)">Orange<small>#F58A1F</small></div>
    <div class="sw" style="background:var(--brand-amber); color: var(--brand-navy)">Amber<small>#FFC24A</small></div>
    <div class="sw" style="background: var(--grad-blue)">Blue Gradient<small>logo gradient</small></div>
  </div>
</body></html>
